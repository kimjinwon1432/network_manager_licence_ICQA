<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>네트워크관리사 2급 실기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1620; --surface:#16212E; --surface2:#1D2B3A; --line:#2A3B4D;
  --text:#E7EDF3; --muted:#8CA0B3; --amber:#FF9F45; --green:#4FC08D; --red:#E5606B;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans KR',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px;min-height:100vh;display:flex;flex-direction:column;}

.hop-trail{display:flex;align-items:center;gap:3px;margin-bottom:22px;}
.hop{flex:1;height:3px;background:var(--line);border-radius:2px;position:relative;overflow:hidden;}
.hop.done{background:var(--amber);}
.hop.current{background:var(--line);}
.hop.current::after{content:'';position:absolute;left:0;top:0;bottom:0;width:40%;background:var(--amber);animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%{left:-40%;}100%{left:100%;}}

.home-hero{margin-bottom:22px;}
.home-hero .eyebrow{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.02em;margin-bottom:8px;}
.home-hero h1{font-size:26px;line-height:1.3;margin:0 0 10px;font-weight:700;}
.home-hero p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0;}

.wrongbook-card{background:var(--surface);border:1px solid var(--amber);border-radius:10px;padding:16px;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:18px;transition:background .15s;}
.wrongbook-card:active{background:var(--surface2);}
.wrongbook-card.empty{border-color:var(--line);opacity:.55;cursor:default;}
.wb-left{display:flex;align-items:center;gap:12px;}
.wb-icon{font-family:var(--mono);font-size:20px;color:var(--amber);}
.wb-title{font-size:15.5px;font-weight:600;}
.wb-sub{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
.wb-count{font-family:var(--mono);font-size:22px;color:var(--amber);font-weight:600;}

.section-label{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em;margin:4px 0 10px;}

.cat-list{display:flex;flex-direction:column;gap:10px;}
.cat-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s,background .15s;}
.cat-card:active{background:var(--surface2);}
.cat-card:hover{border-color:var(--amber);}
.cat-info .num{font-family:var(--mono);font-size:11px;color:var(--amber);margin-bottom:4px;}
.cat-info .title{font-size:16px;font-weight:600;margin-bottom:3px;}
.cat-info .meta{font-size:12.5px;color:var(--muted);font-family:var(--mono);}
.cat-badge{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--bg);background:var(--amber);border-radius:4px;padding:1px 6px;margin-left:7px;vertical-align:middle;}
.cat-arrow{font-family:var(--mono);color:var(--muted);font-size:18px;}
.cat-progress{font-family:var(--mono);font-size:11px;color:var(--green);}

.reset-row{margin-top:24px;text-align:center;}
.reset-btn{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;text-decoration:underline;cursor:pointer;padding:8px;}

.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.back-btn{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:13px;cursor:pointer;padding:6px 0;}
.qcount{font-family:var(--mono);font-size:13px;color:var(--muted);}
.mode-tag{font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:2px 7px;margin-bottom:8px;display:inline-block;}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 18px;margin-top:14px;}
.qprompt{font-size:17px;line-height:1.55;font-weight:500;margin-bottom:20px;}

.option{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:13px 14px;margin-bottom:9px;color:var(--text);font-size:15px;font-family:var(--sans);cursor:pointer;transition:border-color .12s,background .12s;line-height:1.4;}
.option:active{background:#243546;}
.option.selected{border-color:var(--amber);}
.option.correct{border-color:var(--green);background:rgba(79,192,141,.12);}
.option.wrong{border-color:var(--red);background:rgba(229,96,107,.12);}
.option:disabled{cursor:default;}
.opt-letter{font-family:var(--mono);color:var(--amber);margin-right:9px;font-size:13px;}

.hint-row{margin-top:6px;}
.hint-btn{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;padding:6px 0;text-decoration:underline;}
.hint-text{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;padding:10px 12px;background:var(--surface2);border-radius:8px;border-left:2px solid var(--amber);}

.explain-box{margin-top:16px;padding:14px 14px;border-radius:8px;background:var(--surface2);border-left:3px solid var(--green);font-size:13.5px;line-height:1.6;color:var(--text);}
.explain-box.wrong-box{border-left-color:var(--red);}
.explain-label{font-family:var(--mono);font-size:11px;margin-bottom:5px;letter-spacing:.02em;}
.explain-label.ok{color:var(--green);}
.explain-label.no{color:var(--red);}
.wb-note{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:8px;}

.next-btn{margin-top:16px;width:100%;background:var(--amber);color:#12181f;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.next-btn:active{opacity:.85;}

.typing-note{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.6;}
.cmd-input{width:100%;background:#0B1119;border:1px solid var(--line);border-radius:8px;color:var(--text);
  font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:12px 13px;resize:vertical;min-height:140px;}
.cmd-input:focus{outline:none;border-color:var(--amber);}
.cmd-input[readonly]{opacity:.75;}
.grade-btn{margin-top:12px;width:100%;background:var(--amber);color:#12181f;border:none;border-radius:8px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.grade-btn:disabled{opacity:.4;}

.line-review{margin-top:16px;display:flex;flex-direction:column;gap:6px;}
.line-item{font-family:var(--mono);font-size:12.5px;padding:9px 11px;border-radius:6px;background:var(--surface2);border-left:3px solid var(--line);line-height:1.6;}
.line-item.ok{border-left-color:var(--green);}
.line-item.no{border-left-color:var(--red);}
.line-num{color:var(--muted);margin-right:6px;}
.line-user{color:var(--text);}
.line-expected{color:var(--green);margin-top:3px;}
.result-tag{font-family:var(--mono);font-size:11px;margin-bottom:16px;}
.result-tag.ok{color:var(--green);}
.result-tag.no{color:var(--red);}

.result-wrap{text-align:center;padding:40px 0 10px;}
.result-score{font-family:var(--mono);font-size:54px;color:var(--amber);font-weight:600;margin-bottom:6px;}
.result-label{color:var(--muted);font-size:14px;margin-bottom:28px;}
.result-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:28px;}
.result-bar-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--green));}
.result-actions{display:flex;flex-direction:column;gap:10px;}
.btn-primary{background:var(--amber);color:#12181f;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.btn-secondary{background:none;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14px;cursor:pointer;font-family:var(--sans);}

.wrong-list{text-align:left;margin-top:28px;border-top:1px solid var(--line);padding-top:20px;}
.wrong-list h3{font-size:13px;color:var(--muted);font-family:var(--mono);margin-bottom:12px;font-weight:500;}
.wrong-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13.5px;line-height:1.5;}
.wrong-item .wq{color:var(--text);margin-bottom:4px;}
.wrong-item .wa{color:var(--green);font-family:var(--mono);font-size:12.5px;}

.wblist-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.wblist-main{flex:1;}
.wblist-cat{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-bottom:4px;}
.wblist-q{font-size:14px;line-height:1.45;}
.wblist-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 4px;line-height:1;}
.wblist-del:active{color:var(--red);}
.wblist-empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 0;}
.wblist-actions{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
.clear-link{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:16px;padding:6px;}

footer{text-align:center;color:var(--line);font-family:var(--mono);font-size:11px;margin-top:auto;padding-top:40px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {"categories": [{"title": "출제빈도 핵심 기출", "questions": [{"prompt": "TCP/IP 4계층 중 '전송 계층'에 속하는 프로토콜은?", "options": ["ARP", "ICMP", "TCP", "IGMP"], "correct": 2, "explanation": "인터넷 계층: ARP, RARP, IGMP, ICMP / 전송 계층: TCP, UDP / 응용 계층: SMTP, SNMP, HTTP, DNS 등."}, {"prompt": "IP 172.168.102.5, 서브넷마스크 255.255.224.0일 때 네트워크 ID는?", "options": ["172.168.64.0", "172.168.96.0", "172.168.102.0", "172.168.128.0"], "correct": 1, "explanation": "256-224=32씩 8구간. 172.168.96.0~172.168.127.255 구간에 102가 포함되므로 네트워크ID는 172.168.96.0."}, {"prompt": "162.128.0.0 ~ 162.128.255.255 범위의 B클래스 네트워크의 네트워크 ID는?", "options": ["162.0.0.0", "162.128.0.0", "162.128.255.0", "162.128.0.1"], "correct": 1, "explanation": "B클래스는 앞 16비트가 네트워크 주소이므로 네트워크 ID는 162.128.0.0."}, {"prompt": "인터넷망(공중망)을 사설망처럼 이용해 회선 비용을 절감하는 기업통신 서비스는?", "options": ["VPN", "MPLS", "VLAN", "NAT"], "correct": 0, "explanation": "VPN(가상사설망)은 공중망을 암호화된 터널로 사설망처럼 이용하는 기술입니다."}, {"prompt": "IPv6의 주소체계 비트 수는?", "options": ["32비트", "64비트", "128비트", "256비트"], "correct": 2, "explanation": "IPv4는 32비트, IPv6는 128비트(16진수 표기)입니다."}, {"prompt": "이미 알려진 공격 패턴만 탐지 가능하고, 새로운 침입 유형은 탐지하지 못하는 침입탐지 기법은?", "options": ["오용탐지기법", "비정상탐지기법", "휴리스틱 탐지", "상태기반 검사"], "correct": 0, "explanation": "오용탐지기법은 알려진 패턴만 탐지, 비정상탐지기법은 정상행위 이탈을 탐지해 새 유형도 탐지 가능."}, {"prompt": "공격 서명을 찾아 자동으로 조치를 취해 비정상 트래픽을 실시간 차단하는 보안 솔루션은?", "options": ["IDS", "IPS", "방화벽", "VPN"], "correct": 1, "explanation": "IDS는 탐지만, IPS는 탐지+자동 차단까지 수행합니다."}, {"prompt": "스위치의 한 포트 트래픽을 다른 모니터링 포트로 복제해 보내는 기능은?", "options": ["포트 미러링", "VLAN 트렁킹", "스패닝 트리", "링크 애그리게이션"], "correct": 0, "explanation": "포트 미러링은 트래픽 분석을 위해 특정 포트 트래픽을 다른 포트로 복제합니다."}, {"prompt": "OSI 네트워크 계층(3계층)에서 동작하는 장비는?", "options": ["허브", "스위치", "라우터", "리피터"], "correct": 2, "explanation": "물리계층: 허브·리피터 / 데이터링크: 스위치·브리지 / 네트워크: 라우터."}, {"prompt": "IP 주소를 MAC 주소로 대응시키는 프로토콜은?", "options": ["ARP", "RARP", "ICMP", "DNS"], "correct": 0, "explanation": "ARP는 IP→MAC, RARP는 그 반대입니다."}, {"prompt": "사설 IP를 인터넷 접속 시에만 공인 IP로 변환하는 기술은?", "options": ["DHCP", "NAT", "VPN", "VLAN"], "correct": 1, "explanation": "NAT은 사설 IP를 공인 IP로 변환하는 기술입니다."}, {"prompt": "서로 다른 통신망을 상호 접속시켜주는 장치는?", "options": ["라우터", "브리지", "게이트웨이", "리피터"], "correct": 2, "explanation": "게이트웨이는 서로 다른 프로토콜/통신망을 연결하는 관문 역할입니다."}, {"prompt": "다음 중 B클래스 사설 IP 대역은?", "options": ["10.0.0.0 ~ 10.255.255.255", "172.16.0.0 ~ 172.31.255.255", "192.168.0.0 ~ 192.168.255.255", "169.254.0.0 ~ 169.254.255.255"], "correct": 1, "explanation": "B클래스 사설대역은 172.16.0.0/12입니다."}, {"prompt": "MAC 계층에서 두 세그먼트 사이 패킷 전송을 담당하는 장치는?", "options": ["브리지", "라우터", "게이트웨이", "허브"], "correct": 0, "explanation": "브리지는 데이터링크 계층(MAC 기준)에서 동작합니다."}, {"prompt": "다음 중 RFID 시스템 구성요소가 아닌 것은?", "options": ["리더기(Reader)", "태그(Tag)", "안테나", "Access Point"], "correct": 3, "explanation": "RFID는 태그+리더기+안테나로 구성되며 Access Point는 Wi-Fi 장비입니다."}, {"prompt": "매니저-에이전트 간 관리 정보를 '메시지' 단위로 주고받는 프로토콜은?", "options": ["SNMP", "ICMP", "SMTP", "Telnet"], "correct": 0, "explanation": "SNMP는 네트워크 장비 관리를 위한 매니저-에이전트 프로토콜입니다."}, {"prompt": "오류 보고 및 상태 진단(ping, traceroute)에 사용되는 프로토콜은?", "options": ["ICMP", "IGMP", "ARP", "TCP"], "correct": 0, "explanation": "ICMP는 오류 보고와 상태 진단용 프로토콜입니다."}, {"prompt": "하나의 디스크 손상 시 다른 디스크의 복사본으로 복구 가능한 동적 볼륨은?", "options": ["스트라이프 볼륨", "미러링 볼륨", "스팬 볼륨", "단순 볼륨"], "correct": 1, "explanation": "미러링 볼륨은 RAID 1과 같은 원리로 데이터를 이중 기록합니다."}, {"prompt": "가짜 웹사이트로 이용자를 유인해 정보를 탈취하는 해킹 수법은?", "options": ["스니핑", "스푸핑", "스캐닝", "디도스"], "correct": 1, "explanation": "스푸핑은 IP·웹사이트 등을 위장해 사용자를 속이는 공격 기법입니다."}, {"prompt": "원격 로그인·명령 실행·파일 복사를 암호화된 채널로 지원하는 프로토콜은?", "options": ["Telnet", "SSH", "FTP", "RDP"], "correct": 1, "explanation": "SSH는 Telnet과 같은 기능을 암호화하여 안전하게 지원합니다."}, {"prompt": "첫 비트가 항상 0이며 네트워크 127개, 호스트 2^24개를 지원하는 IP 클래스는?", "options": ["A class", "B class", "C class", "D class"], "correct": 0, "explanation": "A클래스는 첫 비트 0, 네트워크부 8비트/호스트부 24비트 구조입니다."}], "type": "mc"}, {"title": "리눅스 명령어 & 프로토콜", "questions": [{"prompt": "리눅스 시스템의 CPU 사용량, 우선순위 등을 실시간 모니터링하는 유틸리티는   const key = catIndex + '-' + qIndex;
  wrongBook[key] = Object.assign({}, q, { catIndex, qIndex, catTitle });
  saveJSON(WRONGBOOK_KEY, wrongBook);
}
function removeFromWrongBook(catIndex, qIndex){
  delete wrongBook[catIndex + '-' + qIndex];
  saveJSON(WRONGBOOK_KEY, wrongBook);
}

// ---- typing-mode grading engine ----
function normalizeLine(s){
  return s.trim().toLowerCase().replace(/\s+/g, ' ');
}
function stripPrompt(s){
  return s.replace(/^[^\s>#]+(\([^)]*\))?[>#]\s*/, '');
}
// A user token matches a canonical keyword token if it's a non-empty case-insensitive
// prefix of it (min 2 chars, or full token if shorter than 2 chars). Value tokens (IPs,
// numbers, names) must match exactly.
function tokenMatches(userTok, canonTok, isKeyword){
  if(!isKeyword) return userTok === canonTok;
  if(userTok.length === 0) return false;
  return canonTok.startsWith(userTok);
}
// splits concatenated interface-style tokens like "fa0/0" or "s2/0" into ["fa","0/0"]
// so they line up positionally with canonical "fastethernet 0/0" style tokens.
function expandConcatenated(tokens){
  const out = [];
  for(const t of tokens){
    const m = t.match(/^([a-z]+)([0-9].*)$/);
    if(m){ out.push(m[1], m[2]); } else { out.push(t); }
  }
  return out;
}
function lineMatches(lineDef, userRaw){
  const userClean = normalizeLine(stripPrompt(userRaw));
  const canonTokens = lineDef.canonical.split(' ');
  let userTokens = userClean.length ? userClean.split(' ') : [];
  if(userTokens.length !== canonTokens.length){
    userTokens = expandConcatenated(userTokens);
  }
  if(userTokens.length !== canonTokens.length) return false;
  for(let i=0;i<canonTokens.length;i++){
    if(!tokenMatches(userTokens[i], canonTokens[i], lineDef.mask[i])) return false;
  }
  return true;
}
function gradeTyping(lines, userText){
  const rawLines = userText.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const results = lines.map((lineDef, i) => {
    const userRaw = rawLines[i] || '';
    const ok = userRaw.length>0 && lineMatches(lineDef, userRaw);
    return { ok, expected: lineDef.canonical, userRaw };
  });
  const allOk = results.every(r => r.ok) && rawLines.length === lines.length;
  return { results, allOk };
}

let state = { screen:'home', qSet:[], qIndex:0, answers:[], selected:null, showHint:false,
  title:'', isReview:false, catIndex:null, typingText:'', typingGraded:false, typingResult:null };

const app = document.getElementById('app');

function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'wronglist') renderWrongList();
  else if(state.screen === 'quiz') renderQuiz();
  else if(state.screen === 'result') renderResult();
}

function renderHome(){
  const wbCount = wrongBookCount();
  let wbCard = wbCount > 0
    ? `<div class="wrongbook-card" onclick="goWrongList()"><div class="wb-left"><div class="wb-icon">&#9888;</div><div><div class="wb-title">오답노트</div><div class="wb-sub">틀렸던 문제 모아보기</div></div></div><div class="wb-count">${wbCount}</div></div>`
    : `<div class="wrongbook-card empty"><div class="wb-left"><div class="wb-icon">&#9888;</div><div><div class="wb-title">오답노트</div><div class="wb-sub">아직 틀린 문제가 없습니다</div></div></div><div class="wb-count">0</div></div>`;

  let cards = DATA.categories.map((cat, i) => {
    let best = (progress[i] && progress[i].best) || null;
    let progHtml = best !== null ? `<div class="cat-progress">최고 ${best}/${cat.questions.length}</div>` : '';
    let badge = cat.type === 'typing' ? `<span class="cat-badge">타이핑</span>` : '';
    return `<div class="cat-card" onclick="startCategory(${i})">
      <div class="cat-info">
        <div class="num">SET ${String(i+1).padStart(2,'0')}</div>
        <div class="title">${cat.title}${badge}</div>
        <div class="meta">${cat.questions.length}문항</div>
      </div>
      <div style="text-align:right">${progHtml}<div class="cat-arrow">&#8594;</div></div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="home-hero">
      <div class="eyebrow">ICQA &middot; NETWORK ADMIN LV.2</div>
      <h1>네트워크관리사 2급<br>실기 대비 퀴즈</h1>
      <p>기출 단답형 + 라우터 실기 명령어 타이핑 연습, 총 ${DATA.categories.reduce((a,c)=>a+c.questions.length,0)}문항.</p>
    </div>
    ${wbCard}
    <div class="section-label">세트 목록</div>
    <div class="cat-list">${cards}</div>
    <div class="reset-row"><button class="reset-btn" onclick="resetAllProgress()">전체 기록 초기화</button></div>
    <footer>네트워크관리사 2급 실기 대비 &middot; 모바일 웹퀴즈</footer>
  `;
}

function goWrongList(){ state.screen = 'wronglist'; render(); }

function renderWrongList(){
  const entries = Object.entries(wrongBook);
  let body;
  if(entries.length === 0){
    body = `<div class="wblist-empty">오답노트가 비어있습니다.<br>틀린 문제가 여기 자동으로 쌓입니다.</div>`;
  } else {
    let items = entries.map(([key, e]) => {
      let qtext = e.type === 'typing' ? e.scenario : e.prompt;
      return `<div class="wblist-item"><div class="wblist-main"><div class="wblist-cat">${e.catTitle}</div><div class="wblist-q">${qtext}</div></div><button class="wblist-del" onclick="deleteWrongItem('${key}')">&#10005;</button></div>`;
    }).join('');
    body = `<div>${items}</div>
      <div class="wblist-actions"><button class="btn-primary" onclick="startWrongReview()">전체 복습 시작 (${entries.length}문항)</button></div>
      <button class="clear-link" onclick="clearWrongBook()">오답노트 전체 비우기</button>`;
  }
  app.innerHTML = `
    <div class="quiz-top"><button class="back-btn" onclick="goHome()">&#8592; 목록</button><span class="qcount">오답노트</span></div>
    <div class="section-label" style="margin-top:18px">틀렸던 문제 (${entries.length})</div>
    ${body}
  `;
}

function deleteWrongItem(key){ delete wrongBook[key]; saveJSON(WRONGBOOK_KEY, wrongBook); render(); }
function clearWrongBook(){ if(confirm('오답노트를 모두 비울까요?')){ wrongBook = {}; saveJSON(WRONGBOOK_KEY, wrongBook); render(); } }

function resetQState(){
  state.qIndex = 0; state.answers = []; state.selected = null; state.showHint = false;
  state.typingText = ''; state.typingGraded = false; state.typingResult = null;
}

function startCategory(i){
  const cat = DATA.categories[i];
  state.qSet = cat.questions.map((q, j) => Object.assign({ catIndex:i, qIndex:j, type: cat.type }, q));
  state.title = cat.title;
  state.isReview = false;
  state.catIndex = i;
  resetQState();
  state.screen = 'quiz';
  render();
}

function startWrongReview(){
  const entries = Object.values(wrongBook);
  if(entries.length === 0) return;
  state.qSet = entries.map(e => Object.assign({}, e));
  state.title = '오답노트 복습';
  state.isReview = true;
  state.catIndex = null;
  resetQState();
  state.screen = 'quiz';
  render();
}

function renderQuiz(){
  const q = state.qSet[state.qIndex];
  if(q.type === 'typing') renderTypingQuestion(q);
  else renderMCQuestion(q);
}

function quizHeader(total){
  let hops = '';
  for(let i=0;i<total;i++){
    let cls = 'hop';
    if(i < state.qIndex) cls += ' done';
    else if(i === state.qIndex) cls += ' current';
    hops += `<div class="${cls}"></div>`;
  }
  return `<div class="quiz-top"><button class="back-btn" onclick="goHome()">&#8592; 목록</button><span class="qcount">${state.qIndex+1} / ${total}</span></div>
    ${state.isReview ? `<div class="mode-tag">오답노트 복습</div>` : ''}
    <div class="hop-trail">${hops}</div>`;
}

function renderMCQuestion(q){
  const total = state.qSet.length;
  let answered = state.selected !== null;
  let optionsHtml = q.options.map((opt, idx) => {
    let cls = 'option';
    if(answered){
      if(idx === q.correct) cls += ' correct';
      else if(idx === state.selected) cls += ' wrong';
    } else if(idx === state.selected){ cls += ' selected'; }
    let letter = String.fromCharCode(65+idx);
    return `<button class="${cls}" ${answered?'disabled':''} onclick="selectOption(${idx})"><span class="opt-letter">${letter}</span>${opt}</button>`;
  }).join('');

  let explainHtml = '';
  if(answered){
    let isCorrect = state.selected === q.correct;
    let wbNote = '';
    if(state.isReview && isCorrect) wbNote = `<div class="wb-note">오답노트에서 제거됨</div>`;
    else if(!isCorrect) wbNote = `<div class="wb-note">오답노트에 저장됨</div>`;
    explainHtml = `<div class="explain-box ${isCorrect?'':'wrong-box'}"><div class="explain-label ${isCorrect?'ok':'no'}">${isCorrect?'정답입니다':'오답입니다 — 정답: '+q.options[q.correct]}</div>${q.explanation}${wbNote}</div>
    <button class="next-btn" onclick="nextQuestion()">${state.qIndex < total-1 ? '다음 문제' : '결과 보기'}</button>`;
  }
  let hintHtml = '';
  if(q.hint && !answered){
    hintHtml = `<div class="hint-row"><button class="hint-btn" onclick="toggleHint()">${state.showHint?'힌트 숨기기':'힌트 보기'}</button>${state.showHint ? `<div class="hint-text">${q.hint}</div>` : ''}</div>`;
  }
  app.innerHTML = `${quizHeader(total)}
    <div class="qcard"><div class="qprompt">${q.prompt}</div>${optionsHtml}${hintHtml}${explainHtml}</div>`;
}

function renderTypingQuestion(q){
  const total = state.qSet.length;
  const graded = state.typingGraded;
  const linesCount = q.lines.length;

  let reviewHtml = '';
  let resultTagHtml = '';
  if(graded){
    const r = state.typingResult;
    let items = r.results.map((res, i) => `
      <div class="line-item ${res.ok?'ok':'no'}">
        <span class="line-num">${i+1}.</span><span class="line-user">${res.userRaw || '(입력 없음)'}</span> ${res.ok?'&#10003;':'&#10007;'}
        ${res.ok ? '' : `<div class="line-expected">정답: ${res.expected}</div>`}
      </div>`).join('');
    reviewHtml = `<div class="line-review">${items}</div>`;
    let wbNote = '';
    if(state.isReview && r.allOk) wbNote = `<div class="wb-note">오답노트에서 제거됨</div>`;
    else if(!r.allOk) wbNote = `<div class="wb-note">오답노트에 저장됨</div>`;
    resultTagHtml = `<div class="result-tag ${r.allOk?'ok':'no'}">${r.allOk ? '전부 맞았습니다' : '일부 줄이 일치하지 않습니다'}</div>${wbNote}`;
  }

  app.innerHTML = `${quizHeader(total)}
    <div class="qcard">
      <div class="qprompt">${q.scenario}</div>
      <div class="typing-note">enable부터 저장까지, 실제 시험처럼 순서대로 한 줄씩 입력하세요. Router&gt; 같은 프롬프트는 붙여 써도 자동으로 무시됩니다. (end 대신 exit를 단계별로 입력)</div>
      <textarea class="cmd-input" id="cmdInput" ${graded?'readonly':''} rows="${linesCount+1}" placeholder="en\nconf t\n...">${state.typingText}</textarea>
      ${graded ? '' : `<button class="grade-btn" onclick="gradeCurrentTyping()">채점하기</button>`}
      ${resultTagHtml}
      ${reviewHtml}
      ${graded ? `<button class="next-btn" onclick="nextQuestion()">${state.qIndex < total-1 ? '다음 문제' : '결과 보기'}</button>` : ''}
    </div>`;

  if(!graded){
    const el = document.getElementById('cmdInput');
    if(el) el.addEventListener('input', e => { state.typingText = e.target.value; });
  }
}

function gradeCurrentTyping(){
  const q = state.qSet[state.qIndex];
  const result = gradeTyping(q.lines, state.typingText);
  state.typingGraded = true;
  state.typingResult = result;
  state.answers.push(result.allOk);
  if(!result.allOk) addToWrongBook(q.catIndex, q.qIndex, q, (q.catTitle || (DATA.categories[q.catIndex] && DATA.categories[q.catIndex].title)));
  else if(state.isReview) removeFromWrongBook(q.catIndex, q.qIndex);
  render();
}

function selectOption(idx){
  if(state.selected !== null) return;
  state.selected = idx;
  const q = state.qSet[state.qIndex];
  const isCorrect = idx === q.correct;
  state.answers.push(isCorrect);
  if(!isCorrect) addToWrongBook(q.catIndex, q.qIndex, q, (q.catTitle || (DATA.categories[q.catIndex] && DATA.categories[q.catIndex].title)));
  else if(state.isReview) removeFromWrongBook(q.catIndex, q.qIndex);
  render();
}

function toggleHint(){ state.showHint = !state.showHint; render(); }

function nextQuestion(){
  if(state.qIndex < state.qSet.length - 1){
    state.qIndex++;
    state.selected = null; state.showHint = false;
    state.typingText = ''; state.typingGraded = false; state.typingResult = null;
    render();
  } else { finishQuiz(); }
}

function finishQuiz(){
  const score = state.answers.filter(a=>a).length;
  const total = state.qSet.length;
  if(!state.isReview && state.catIndex !== null){
    const prev = progress[state.catIndex] || {best:0};
    progress[state.catIndex] = { best: Math.max(prev.best||0, score), last: score, total };
    saveJSON(PROGRESS_KEY, progress);
  }
  state.screen = 'result';
  render();
}

function renderResult(){
  const total = state.qSet.length;
  const score = state.answers.filter(a=>a).length;
  const pct = Math.round((score/total)*100);

  let wrongItems = [];
  state.qSet.forEach((q, i) => {
    if(state.answers[i] === false){
      let qtext = q.type === 'typing' ? q.scenario : q.prompt;
      let answerText = q.type === 'typing' ? q.lines.map(l=>l.canonical).join(' / ') : q.options[q.correct];
      wrongItems.push(`<div class="wrong-item"><div class="wq">${qtext}</div><div class="wa">정답: ${answerText}</div></div>`);
    }
  });
  let wrongHtml = wrongItems.length ? `<div class="wrong-list"><h3>틀린 문제 (${wrongItems.length}) &middot; 오답노트에 저장됨</h3>${wrongItems.join('')}</div>` : '';

  let retryLabel = state.isReview ? '오답노트 다시 복습' : '다시 풀기';
  let retryAction = state.isReview ? 'startWrongReview()' : `startCategory(${state.catIndex})`;
  let retryDisabled = state.isReview && wrongBookCount() === 0;

  app.innerHTML = `
    <div class="result-wrap">
      <div class="result-score">${score}<span style="color:var(--muted);font-size:28px">/${total}</span></div>
      <div class="result-label">${state.title} &middot; 정답률 ${pct}%</div>
      <div class="result-bar"><div class="result-bar-fill" style="width:${pct}%"></div></div>
      <div class="result-actions">
        ${retryDisabled ? '' : `<button class="btn-primary" onclick="${retryAction}">${retryLabel}</button>`}
        <button class="btn-secondary" onclick="goHome()">세트 목록으로</button>
      </div>
      ${wrongHtml}
    </div>`;
}

function goHome(){ state.screen = 'home'; render(); }
function resetAllProgress(){
  if(confirm('모든 세트의 최고 기록을 초기화할까요? (오답노트는 유지됩니다)')){
    progress = {}; saveJSON(PROGRESS_KEY, progress); render();
  }
}

render();
</script>
</body>
</html>
